name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/api/go.sum
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build -o /tmp/fleetdeck-api ./cmd/fleetdeck-api
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/agent/go.sum
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build -o /tmp/fleetdeck-agent ./cmd/fleetdeck-agent
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Audit (fail on high/critical)
        run: pnpm audit --prod --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build

  e2e:
    runs-on: ubuntu-latest
    needs: [compose]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          # Unique volume + bind for CI isolation is fine with default compose names.
      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build db api web
      - name: Wait for API healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'; then
              echo "api ready"
              exit 0
            fi
            sleep 2
          done
          echo "API healthz did not become ready"
          docker compose -f deploy/docker-compose.yml logs --tail=200 api db
          exit 1
      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "web ready"
              exit 0
            fi
            sleep 2
          done
          echo "web did not become ready"
          docker compose -f deploy/docker-compose.yml logs --tail=200 web
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web + Playwright
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Browser smoke (bootstrap → overview)
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_EMAIL: e2e@fleetdeck.local
          E2E_PASSWORD: e2e-test-password-12
        run: pnpm test:e2e
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
