name: Feature request
description: Suggest an enhancement for FleetDeck
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Implementation ideas are welcome but optional.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that FleetDeck does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from an operator's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Monitoring / metrics
        - Docker management
        - Alerts / notifications
        - Agents / install / update
        - Auth / security
        - UI / UX
        - Deploy / ops
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This fits a self-hosted / local-first product (not a SaaS-only idea)
          required: false
        - label: I am willing to help implement or test if maintainers agree on direction
          required: false
